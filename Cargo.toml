[workspace]
members = [
    "tacklebox-client",
    "tacklebox-core",
    "tacklebox-pico"
]

resolver = "3"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
heapless = { version = "0.9.3", features = ["serde"] }
zeroize = { version = "1.9.1", default-features = false, features = ["derive"] }
